<text xml:space="preserve" text-anchor="start" x="16" y="-27.75" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;³ the mathematical powerset 𝒫(U) is a complete atomic Boolean algebra; the runtime HashSet has ⊥={} but no ⊤ / complement.  &#160;&#160;&#160;&#160;&#160;&#160;&#160;⁴ [1,2]⊔[2,1]=[1,2] ≠ [2,1]=[2,1]⊔[1,2]; meet is left&#45;biased; absorption fails on raw Vec.</text>
