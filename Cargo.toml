[package]
name = "llattice"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/llattice"
description = "Lawful layered join-semilattice, meet-semilattice, lattice, and bottom traits with optimized in-place joins."
keywords = ["lattice", "join", "meet", "semilattice", "crdt"]
categories = ["data-structures", "algorithms"]
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
proptest = { version = "=1.4.0", default-features = false, features = ["std"] }

[[bench]]
name = "hot_paths"
harness = false

# Keep this standalone repository from being captured by an unrelated parent
# workspace when it is checked out beneath another Rust project for validation.
[workspace]
