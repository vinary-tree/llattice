name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. the lattice-law harness)
        run: cargo test --all-targets
      - name: Doctests
        run: cargo test --doc
      # python3 is present on ubuntu-latest; the Coq container job builds the
      # proofs themselves.
      - name: Lattice invariant registry
        run: python3 scripts/check-lattice-invariants.py
      - name: Release-ref authority
        run: python3 scripts/check-release-ref.py --self-test

  proofs:
    name: Lattice-law proofs
    runs-on: ubuntu-latest
    # Rocq >= 9 is published under rocq/rocq-prover, not the legacy
    # coqorg/coq namespace. Pin the exact 9.1.1 amd64 manifest so a moved tag
    # cannot silently change the proof environment.
    container: rocq/rocq-prover:9.1.1@sha256:b85a80a11bb65c7c843f91c7cbcce282f22ee397c9ca42f123d568ab6cef68b0
    steps:
      - uses: actions/checkout@v4
      - name: Reject unchecked proof escapes
        run: make -C proofs/coq proof-check
      - name: Build the Rocq proofs
        run: make -C proofs/coq
