name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. the lattice-law harness)
        run: cargo test --all-targets
      - name: Doctests
        run: cargo test --doc
      # python3 is present on ubuntu-latest; the Coq container job builds the
      # proofs themselves.
      - name: Lattice invariant registry
        run: python3 scripts/check-lattice-invariants.py
      - name: Release-ref authority
        run: python3 scripts/check-release-ref.py --self-test

  proofs:
    name: Lattice-law proofs
    runs-on: ubuntu-latest
    # Rocq >= 9 is published under rocq/rocq-prover, not the legacy
    # coqorg/coq namespace. Pin the exact 9.1.1 amd64 manifest so a moved tag
    # cannot silently change the proof environment.
    container:
      # yamllint disable-line rule:line-length
      image: rocq/rocq-prover:9.1.1@sha256:b85a80a11bb65c7c843f91c7cbcce282f22ee397c9ca42f123d568ab6cef68b0
      # The image's default user cannot write GitHub's mounted runner-command
      # files, so checkout fails before any proof is evaluated.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Reject unchecked proof escapes
        run: make -C proofs/coq proof-check
      - name: Build the Rocq proofs
        # GitHub's root container user does not inherit the image's opam-switch
        # PATH. Execute inside the pinned switch explicitly so coq_makefile and
        # the Rocq tools resolve from the digest-pinned image.
        run: >-
          opam exec --root=/home/coq/.opam --switch="$COMPILER" --
          make -C proofs/coq

  julia:
    name: Julia lattice values and providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the matching interop branch
        id: interop-ref
        shell: bash
        run: |
          set -euo pipefail
          candidate=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          if git ls-remote --exit-code --heads \
            https://github.com/vinary-tree/vinary-tree-interop.git \
            "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >>"$GITHUB_OUTPUT"
          else
            echo "ref=main" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: vinary-tree/vinary-tree-interop
          ref: ${{ steps.interop-ref.outputs.ref }}
          path: target/vinary-tree-interop
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.10' }
      - name: Test type-stable values and host providers
        shell: bash
        run: |
          set -euo pipefail
          julia -e '
            using Pkg
            Pkg.activate("target/julia-test")
            Pkg.develop([
              Pkg.PackageSpec(path="target/vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="bindings/julia/LLattice"),
            ])
            Pkg.test("LLattice")
          ' 2>&1 | tee "$RUNNER_TEMP/llattice-julia-test.log"
      - name: Smoke benchmark pairwise and batch boundaries
        env:
          LLATTICE_BENCH_ITERATIONS: '1000'
          LLATTICE_BENCH_SAMPLES: '3'
        shell: bash
        run: |
          set -euo pipefail
          julia --project=target/julia-test \
            bindings/julia/LLattice/benchmark/compare.jl \
            2>&1 | tee "$RUNNER_TEMP/llattice-julia-benchmark.log"
      - name: Build Documenter reference
        shell: bash
        run: |
          set -euo pipefail
          julia -e '
            using Pkg
            Pkg.activate("bindings/julia/LLattice/docs")
            Pkg.develop([
              Pkg.PackageSpec(path="target/vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="bindings/julia/LLattice"),
            ])
            Pkg.instantiate()
            include("bindings/julia/LLattice/docs/make.jl")
          ' 2>&1 | tee "$RUNNER_TEMP/llattice-julia-docs.log"

  raku:
    name: Raku lattice values and providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the matching interop branch
        id: interop-ref
        shell: bash
        run: |
          set -euo pipefail
          candidate=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          if git ls-remote --exit-code --heads \
            https://github.com/vinary-tree/vinary-tree-interop.git \
            "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >>"$GITHUB_OUTPUT"
          else
            echo "ref=main" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: vinary-tree/vinary-tree-interop
          ref: ${{ steps.interop-ref.outputs.ref }}
          path: target/vinary-tree-interop
      # Raku/setup-raku v1, pinned for reproducible action execution.
      - uses: Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f
      - name: Install the shared ABI package
        run: zef install --/test ./target/vinary-tree-interop/bindings/raku
      - name: Build and test the distribution
        shell: bash
        run: |
          set -euo pipefail
          zef build ./bindings/raku 2>&1 | tee "$RUNNER_TEMP/llattice-raku-build.log"
          zef test ./bindings/raku 2>&1 | tee "$RUNNER_TEMP/llattice-raku-test.log"
      - name: Smoke benchmark pairwise and batch boundaries
        env:
          LLATTICE_BENCH_ITERATIONS: '1000'
          LLATTICE_BENCH_SAMPLES: '3'
        shell: bash
        run: |
          set -euo pipefail
          raku -Ibindings/raku/lib bindings/raku/benchmark/compare.raku \
            2>&1 | tee "$RUNNER_TEMP/llattice-raku-benchmark.log"

  binding-matrix:
    name: Binding completeness matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
      - run: raku scripts/check-bindings.raku
